<!-- Template: email signature. Table layout and inline styles only, because email clients
     strip <style> and ignore CSS variables. Light ground: most inboxes are light.
     Host the logo at a public HTTPS URL (e.g. the website's /brand/sanad-mark-on-light.png, 96px)
     and replace {{LOGO_URL}}; never attach it. Replace the other {{PLACEHOLDERS}}. -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#070B14;font-size:13px;line-height:1.5">
  <tr>
    <td style="padding-right:14px;vertical-align:top">
      <img src="{{LOGO_URL}}" width="48" height="48" alt="Sanad" style="display:block;border:0">
    </td>
    <td style="border-left:1px solid #DDE2EC;padding-left:14px;vertical-align:top">
      <div style="font-weight:600;font-size:14px">{{FULL_NAME}}</div>
      <div style="color:#4A5670">{{ROLE}}, Ejadah AI Labs</div>
      <div style="margin-top:6px">
        <a href="https://ejadahailabs.com/products/?utm_source=email&amp;utm_medium=email&amp;utm_campaign=signature" style="color:#7A6218;text-decoration:none;font-weight:500">Sanad</a>
        <span style="color:#5B6780"> · the Ejadah Engineering Intelligence Platform</span>
      </div>
    </td>
  </tr>
</table>
